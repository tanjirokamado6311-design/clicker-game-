<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Levels Clicker Challenge</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding-top: 50px;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #restartBtn {
            background-color: #28a745;
            display: none;
        }
        #score, #timer-display, #level-display {
            font-size: 24px;
            margin-top: 15px;
            font-weight: bold;
        }
        #timer-display {
            color: red;
        }
        #message {
            font-size: 20px;
            color: green;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1 id="game-title">100 Levels Clicker Challenge!</h1>
    <div id="level-display">Level 1: 10 Sec mein 15 Clicks karo!</div>
    <div id="timer-display">Time Left: 10s</div>
    
    <button id="clickBtn" onclick="incrementCount()">Start & Click Me</button>
    <button id="restartBtn" onclick="resetGame()">Play Again (Restart)</button>
    
    <div id="score">Clicks: <span id="clickScore">0</span> / <span id="targetScore">15</span></div>
    <div id="message"></div>

    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" type="audio/wav">
    </audio>

    <audio id="clickSound">
        <source src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav" type="audio/wav">
    </audio>

<script>
    let count = 0;
    let timeLeft = 10;
    let timerId = null;
    let gameStarted = false;
    let currentLevel = 1;
    let maxLevels = 100;

    let bgMusic = document.getElementById("bgMusic");
    let clickSound = document.getElementById("clickSound");

    // Har level ke liye clicks aur time automatic calculate hoga
    // Level 1: 15 clicks, Level 2: 20 clicks... Level 100: 510 clicks
    function getTargetClicks(level) {
        return 10 + (level * 5); 
    }

    function getTimeLimit(level) {
        return 10 + Math.floor(level * 1.5); 
    }

    function updateDisplay() {
        let target = getTargetClicks(currentLevel);
        let time = getTimeLimit(currentLevel);
        document.getElementById("level-display").innerText = "Level " + currentLevel + ": " + time + " Sec mein " + target + " Clicks karo!";
        document.getElementById("targetScore").innerText = target;
        if(!gameStarted) {
            document.getElementById("timer-display").innerText = "Time Left: " + time + "s";
            timeLeft = time;
        }
    }

    function startTimer() {
        gameStarted = true;
        bgMusic.volume = 0.3;
        bgMusic.play().catch(e => console.log("Music error:", e));

        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById("timer-display").innerText = "Time Left: " + timeLeft + "s";

            if (timeLeft <= 0) {
                clearInterval(timerId);
                gameOver(false);
            }
        }, 1000);
    }

    function incrementCount() {
        if (!gameStarted) {
            startTimer();
        }

        clickSound.currentTime = 0;
        clickSound.play();

        count++;
        document.getElementById("clickScore").innerText = count;

        let target = getTargetClicks(currentLevel);

        if (count >= target) {
            clearInterval(timerId);
            showAd(); // Har level clear hone par automatic Ad khulegi

            if (currentLevel >= maxLevels) {
                gameOver(true); // Agar poore 100 levels ho gaye
            } else {
                currentLevel++;
                count = 0;
                gameStarted = false;
                document.getElementById("clickScore").innerText = count;
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText = "Zabardast! Level " + (currentLevel-1) + " paar. Ab Level " + currentLevel + " ki baari!";
                updateDisplay();
            }
        }
    }

    function gameOver(isWin) {
        gameStarted = false;
        clearInterval(timerId);
        document.getElementById("clickBtn").disabled = true;
        document.getElementById("restartBtn").style.display = "inline-block"; // Game khatam hone par Restart dikhega
        bgMusic.pause();

        if (isWin) {
            document.getElementById("message").style.color = "green";
            document.getElementById("message").innerText = "Sultan! Aapne poore 100 Levels khatam kar diye!";
        } else {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText = "Game Over! Time khatam ho gaya. Dobara koshish karein!";
        }
    }

    function resetGame() {
        count = 0;
        currentLevel = 1;
        gameStarted = false;
        document.getElementById("clickBtn").disabled = false;
        document.getElementById("restartBtn").style.display = "none";
        document.getElementById("message").innerText = "";
        document.getElementById("clickScore").innerText = count;
        updateDisplay();
    }

    function showAd() {
        // Yahan aap apna working ad link daal sakte hain (Abhi ke liye google.com lagaya hai)
        window.open("https://www.google.com", "_blank"); 
    }

    // Pehli baar load hone par screen set karein
    updateDisplay();
</script>

</body>
</html>
