<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Challenge Clicker</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding-top: 50px;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #score, #timer-display, #level-display {
            font-size: 24px;
            margin-top: 15px;
            font-weight: bold;
        }
        #timer-display {
            color: red;
        }
        #message {
            font-size: 20px;
            color: green;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1 id="game-title">Clicker Time Challenge!</h1>
    <div id="level-display">Level 1: 10 Sec mein 20 Clicks karo!</div>
    <div id="timer-display">Time Left: 10s</div>
    
    <button id="clickBtn" onclick="incrementCount()">Start & Click Me</button>
    
    <div id="score">Clicks: <span id="clickScore">0</span></div>
    <div id="message"></div>

    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" type="audio/wav">
    </audio>

    <audio id="clickSound">
        <source src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav" type="audio/wav">
    </audio>

<script>
    let count = 0;
    let timeLeft = 10;
    let timerId = null;
    let gameStarted = false;
    let currentLevel = 1;

    let bgMusic = document.getElementById("bgMusic");
    let clickSound = document.getElementById("clickSound");

    function startTimer() {
        gameStarted = true;
        bgMusic.volume = 0.3;
        bgMusic.play().catch(e => console.log("Music error:", e));

        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById("timer-display").innerText = "Time Left: " + timeLeft + "s";

            if (timeLeft <= 0) {
                clearInterval(timerId);
                gameOver(false);
            }
        }, 1000);
    }

    function incrementCount() {
        if (!gameStarted) {
            startTimer();
        }

        clickSound.currentTime = 0;
        clickSound.play();

        count++;
        document.getElementById("clickScore").innerText = count;

        if (currentLevel === 1 && count >= 20) {
            clearInterval(timerId);
            currentLevel = 2;
            count = 0;
            timeLeft = 20; 
            document.getElementById("clickScore").innerText = count;
            document.getElementById("level-display").innerText = "Level 2: 20 Sec mein 50 Clicks karo!";
            document.getElementById("timer-display").innerText = "Time Left: " + timeLeft + "s";
            document.getElementById("message").innerText = "Waah! Level 1 clear. Ab Level 2 shuru!";
            
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-display").innerText = "Time Left: " + timeLeft + "s";

                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    gameOver(false);
                }
            }, 1000);
        }
        else if (currentLevel === 2 && count >= 50) {
            clearInterval(timerId);
            gameOver(true); 
        }
    }

    function gameOver(isWin) {
        gameStarted = false;
        document.getElementById("clickBtn").disabled = true;
        bgMusic.pause();

        if (isWin) {
            document.getElementById("message").innerText = "Zabardast! Aapne dono challenge poore kiye!";
            setTimeout(() => {
                showGameOverAd();
            }, 500);
        } else {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText = "Game Over! Time khatam ho gaya. Fir se koshish karein!";
        }
    }

    function showGameOverAd() {
        window.open("https://clksite.com/30039658", "_blank");
    }
</script>

</body>
</html>
